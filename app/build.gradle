plugins {
    id 'com.android.application'
}
apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 36

    defaultConfig {
        applicationId "info.fortheease.seendial"
        minSdk 23
        targetSdk 36
        versionCode 14
        versionName "1.9.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures(){
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
            Properties properties = new Properties()
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
            buildConfigField "String", "ADMOB_APP_ID", "\"${properties.getProperty('ADMOB_APP_ID')}\""
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${properties.getProperty('ADMOB_BANNER_ID')}\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"${properties.getProperty('ADMOB_REWARDED_ID')}\""
            
            resValue "string", "admob_app_id", properties.getProperty('ADMOB_APP_ID')
            resValue "string", "admob_banner_id", properties.getProperty('ADMOB_BANNER_ID')
            resValue "string", "admob_rewarded_id", properties.getProperty('ADMOB_REWARDED_ID')
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            Properties properties = new Properties()
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
            buildConfigField "String", "ADMOB_APP_ID", "\"${properties.getProperty('ADMOB_APP_ID')}\""
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${properties.getProperty('ADMOB_BANNER_ID')}\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"${properties.getProperty('ADMOB_REWARDED_ID')}\""

            resValue "string", "admob_app_id", properties.getProperty('ADMOB_APP_ID')
            resValue "string", "admob_banner_id", properties.getProperty('ADMOB_BANNER_ID')
            resValue "string", "admob_rewarded_id", properties.getProperty('ADMOB_REWARDED_ID')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_20
        targetCompatibility JavaVersion.VERSION_20
    }
    namespace 'info.fortheease.seendial'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.karumi:dexter:6.2.3'
    implementation("com.google.android.ump:user-messaging-platform:3.2.0")
    implementation 'io.github.muddz:styleabletoast:2.4.0'
    implementation 'com.github.hajiyevelnur92:intentanimation:1.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.airbnb.android:lottie:6.6.4'
    implementation 'com.google.android.gms:play-services-ads:24.2.0'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "androidx.room:room-runtime:2.7.0"
    annotationProcessor "androidx.room:room-compiler:2.7.0"
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.15.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
}